spring.application.name=expense-tracker

# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3307/expense_tracker
spring.datasource.username=root
spring.datasource.password=8178862209


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# GEMINI AI
# =========================================================

gemini.api.key=${GEMINI_API_KEY:}

gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}


# =========================================================
# EMAIL NOTIFICATIONS
# =========================================================
# Keep disabled for now.
# We will configure SMTP later if needed.

app.email.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# FILE UPLOAD / JSON SAFETY
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB