spring.application.name=expense-tracker

# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/expense_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# GEMINI AI
# =========================================================

gemini.api.key=${GEMINI_API_KEY:}

gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}


# =========================================================
# EMAIL NOTIFICATIONS
# =========================================================

# Keep disabled by default.
# SMTP can be enabled later through environment variables.

app.email.enabled=${APP_EMAIL_ENABLED:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# FILE UPLOAD / JSON SAFETY
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB